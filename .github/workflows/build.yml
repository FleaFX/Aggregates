name: Build & test

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]
    workflow_call:

jobs:
    build:

        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
        - uses: actions/checkout@v7

        - name: Setup .NET
          uses: actions/setup-dotnet@v6
          with:
            dotnet-version: '10.0.x'

        - name: Restore packages
          run: dotnet restore src/Aggregates.slnx

        - name: Build
          run: dotnet build --no-restore src/Aggregates.slnx

        - name: Unit tests
          run: >
            dotnet test --no-build src/Aggregates.slnx
            --filter "Category!=Integration"
            --logger trx --results-directory TestResults

        # Requires Docker: KurrentDB and SQL Server run in containers (Testcontainers).
        - name: Integration tests
          run: >
            dotnet test --no-build src/Aggregates.slnx
            --filter "Category=Integration"
            --logger trx --results-directory TestResults

        - name: Upload test results
          if: failure()
          uses: actions/upload-artifact@v7
          with:
            name: test-results
            path: TestResults
