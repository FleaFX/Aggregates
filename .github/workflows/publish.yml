name: Publish package

# Releasing: bump VersionPrefix/VersionSuffix in src/Directory.Build.props, merge, then push a
# tag "v<version>" (e.g. v1.0.0 or v1.0.0-preview.7) on that commit.
on:
    push:
        tags: [ "v*" ]

jobs:
    test:
        uses: ./.github/workflows/build.yml

    publish:
        needs: test
        runs-on: ubuntu-latest

        steps:
        - uses: actions/checkout@v7

        - name: Setup .NET
          uses: actions/setup-dotnet@v6
          with:
            dotnet-version: '10.0.x'

        - name: Verify tag matches version
          run: |
            version=$(dotnet msbuild src/Aggregates/Aggregates.csproj -getProperty:Version)
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version v$version in src/Directory.Build.props"
              exit 1
            fi

        - name: Restore packages
          run: dotnet restore src/Aggregates.slnx

        - name: Pack
          run: dotnet pack src/Aggregates.slnx -c Release --no-restore --output packages/

        - name: Push
          env:
            NUGET_API_KEY: ${{ secrets.NUGETAPIKEY }}
          run: >
            dotnet nuget push "packages/*.nupkg"
            --api-key "$NUGET_API_KEY"
            --source https://api.nuget.org/v3/index.json
            --skip-duplicate
